# --- CORE STABILITY (FEDORA 43 + NVIDIA WAYLAND) ---
# Use the stable GPU renderer
vo=gpu
# OpenGL is the most mature path for NVIDIA on Wayland
gpu-api=opengl
gpu-context=wayland
# Hardware decoding: nvdec-copy is the gold standard for quality + compatibility
hwdec=nvdec-copy

# --- FAST STARTUP
ytdl=no
cache=no
# Prevents the player from waiting for network/unnecessary probing
gapless-audio=yes

# --- WINDOW & GEOMETRY ---
# Explicitly set the window size but allow KWin to manage it
geometry=1280x720
autofit=1280x720
# Do not let the video file's native resolution resize your window
auto-window-resize=no
keepaspect-window=no
# Fix for Wayland: prevents window flickering/stalling during init
wayland-disable-wp-fractional-scale=yes

# --- HIGH-END OPTIMIZATION (3060 Ti) ---
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
video-sync=display-resample
interpolation=yes
tscale=oversample

# Debanding (Fixes "pixelated" gradients in dark scenes)
deband=yes
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=48


# ---- Remember volume between sessions
save-position-on-quit=yes
watch-later-options=start,volume

# Start around a sane level
volume=50

# ---- Loudness normalization
audio-normalize-downmix=yes
af=lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]

# Prevent ear destruction from extreme peaks
volume-max=100
