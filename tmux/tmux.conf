# Eliminate the 500ms Esc delay for instant Neovim mode switching
set -s escape-time 0

# 3.6a Exclusive: Shave the initial repeat delay for 144Hz fluid navigation
set -s initial-repeat-time 200

# Enable focus events for clipboard & file-syncing
set -s focus-events on

# Enable new 3.6a extended keys support (Kitty Keyboard Protocol)
set -s extended-keys on

# --- TERMINAL & GPU (Kitty 0.46.2 Integration) ---
set -g default-terminal "tmux-256color"

# sync: Prevents flickering/tearing on high-refresh monitors
# RGB: Enables TrueColor for the 3060 Ti
# extkeys: Native handling of complex key combinations
# hyperlinks: Support for OSC 8 hyperlinks (supported in Kitty 0.46)
set -ga terminal-features ",xterm-kitty:RGB:sync:extkeys:hyperlinks"

# REQUIRED for Neovim/Yazi to render images via Kitty Protocol
set -g allow-passthrough on

# --- BASIC LOGIC & UI ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000

# Directory naming
set -g status-interval 2
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# --- NAVIGATION & VI MODE ---
unbind r
bind r source-file "~/.config/tmux/tmux.conf" \; display-message "Tmux reloaded!"
bind m next-window
bind l previous-window
bind X kill-session

setw -g mode-keys vi
# Wayland-native copy-paste using wl-copy
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

# --- PLUGINS & THEME  ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Initialize TPM 
run '~/.config/tmux/plugins/tpm/tpm'
