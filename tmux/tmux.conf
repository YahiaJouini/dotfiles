unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind r
bind r source-file "~/.config/tmux/tmux.conf" \; display-message "Tmux config reloaded!"

set -g mouse on
set -g base-index 1          # Start windows at 1 instead of 0
setw -g pane-base-index 1    # Start panes at 1 instead of 0
set -g renumber-windows on   # Automatically renumber windows when one is closed

# ==========================================
# WINDOW & DIRECTORY NAMING
# ==========================================
# Show directory name (basename) in the window status
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# ==========================================
# NAVIGATION & VI MODE
# ==========================================
bind m next-window
bind l previous-window
bind X kill-session

# Enable vi mode keys
setw -g mode-keys vi

# Wayland copy-paste (wl-copy)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

# ==========================================
# PLUGINS & STYLE
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Catppuccin Theme Configuration
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Initialize TMUX plugin manager (keep this at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
