# Export all critical variables to dbus AND systemd user session.
# exec_always so they re-export on sway reload too.
exec_always dbus-update-activation-environment --systemd \
    DISPLAY \
    WAYLAND_DISPLAY \
    SWAYSOCK \
    XDG_CURRENT_DESKTOP=sway \
    XDG_SESSION_TYPE=wayland \
    XCURSOR_THEME \
    XCURSOR_SIZE

exec_always systemctl --user import-environment \
    DISPLAY \
    WAYLAND_DISPLAY \
    SWAYSOCK \
    XDG_CURRENT_DESKTOP \
    XDG_SESSION_TYPE

# ============================================================
# NVIDIA-SPECIFIC — GPU env vars for apps that need them
# ============================================================
exec_always systemctl --user set-environment \
    GBM_BACKEND=nvidia-drm \
    __GLX_VENDOR_LIBRARY_NAME=nvidia \
    LIBVA_DRIVER_NAME=nvidia \
    NVD_BACKEND=direct \
    MOZ_ENABLE_WAYLAND=1 \
    ELECTRON_OZONE_PLATFORM_HINT=auto \
    QT_QPA_PLATFORM=wayland \
    SDL_VIDEODRIVER=wayland \
    _JAVA_AWT_WM_NONREPARENTING=1

# ============================================================
# XDG PORTAL — screenshare, file pickers, permissions
# ============================================================
# Restart portal cleanly so it picks up the env vars above.
# The sleep gives dbus time to settle first.
exec systemctl --user restart xdg-desktop-portal-wlr
exec systemctl --user restart xdg-desktop-portal

# ============================================================
# SYSTEM DAEMONS (exec = once at startup only)
# ============================================================
exec /usr/libexec/kf6/polkit-kde-authentication-agent-1
exec --no-startup-id nm-applet --indicator
exec --no-startup-id mako

# ============================================================
# CLIPBOARD
# ============================================================
exec --no-startup-id wl-paste --type text --watch cliphist store
exec --no-startup-id wl-paste --type image --watch cliphist store

# ============================================================
# UI
# ============================================================
exec ~/.config/waybar/scripts/launch.sh
