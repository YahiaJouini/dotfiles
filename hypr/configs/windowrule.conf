# Don’t let floating windows get maximize-spammed by apps
windowrule = match:float 1, suppress_event maximize
# windowrule = match:float 1, suppress_event fullscreen   # optional

# XWayland empty helper windows (ghost/no-class): never steal focus
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, no_focus 1

# Modals behave like modals
windowrule = match:modal 1, float 1
windowrule = match:modal 1, center 1
windowrule = match:modal 1, stay_focused 1

# Pinentry focus fix
windowrule = stay_focused 1, match:class ^(pinentry-.*)$


# ---- pavucontrol popup 
windowrule = match:class ^(org\.pulseaudio\.pavucontrol)$, \
  float 1, \
  size 800 400, \
  center 1, \
  stay_focused 1, \

# ---- Satty Screenshot Annotation
windowrule = match:class ^(com\.gabm\.satty)$, \
  float 1, \
  center 1, \
  size 1200 800, \
  suppress_event fullscreen
  # NO stay_focused here — it blocks the file dialog from getting input!

# ---- Satty's file save dialog (GTK4 native, same class, different title)
windowrule = match:class ^(com\.gabm\.satty)$, match:title ^(Save|Open|Choose)(.*)$, \
  float 1, \
  center 1, \
  size 900 600, \
  stay_focused 1

# ---- Network Manager GUI
windowrule = match:class ^(nm-connection-editor)$, \
  float 1, \
  size 800 600, \
  center 1, \
  stay_focused 1

# ---- System TUIs (Audio & Network)
windowrule = match:class ^(sys-audio-mixer)$, \
  float 1, \
  size 800 450, \
  center 1, \
  stay_focused 1

# ---- Nautilus file picker (GTK portal)
windowrule = match:class ^(xdg-desktop-portal-gtk)$, \
  float 1, \
  size 900 600, \
  center 1, \
  stay_focused 1

windowrule = match:class ^(mpv)$, \
  float 1, \
  size 1280 720, \
  center 1, \
  stay_focused 1

# Fix: JS alert()/confirm() dialogs not surfacing in browsers
windowrule = match:class ^(firefox|Navigator|chromium|brave-browser)$, \
  match:float 1, \
  stay_focused 1

# Prevent idle/lock while mpv is fullscreen
windowrule = match:class ^(mpv)$, idle_inhibit fullscreen
