# Set programs
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun

$mainMod = SUPER # Sets "Windows" key as main modifier

$scriptsDir = $HOME/.config/scripts


bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bindd = $mainMod, V, clipboard ,  exec, $scriptsDir/cliphist.sh
bind = $mainMod SHIFT, V, exec, cliphist wipe #clear clipboard
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, F, exec, hyprctl dispatch fullscreenstate 1 0
bind = $mainMod, L, exec, $scriptsDir/sys-power.sh
# Regoin capture -> save to clipboard only
bind = $mainMod , S, exec, hyprshot -m region --clipboard-only
# Region capture -> save to file
bind = $mainMod SHIFT, S, exec, $scriptsDir/satty-shot.sh

#zoom
# Zoom in (Ctrl + Super + Scroll Up)
bind = CONTROL SUPER, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(hyprctl -j getoption cursor:zoom_factor | jq ".float + 0.5")
# Zoom out (Ctrl + Super + Scroll Down)
bind = CONTROL SUPER, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(hyprctl -j getoption cursor:zoom_factor | jq "[.float - 0.5, 1.0] | max")
# Reset zoom (Ctrl + Super + Click Middle Mouse Button)
bind = CONTROL SUPER, mouse:274, exec, hyprctl keyword cursor:zoom_factor 1.0


#script bindings
bind = $mainMod, W, exec, $scriptsDir/wallpaper.sh #pick random wallpaper
bind = $mainMod, T, exec, $scriptsDir/hyprsunset-toggle.sh
bind = $mainMod, R, exec, $HOME/.config/waybar/scripts/launch.sh #reload waybar


# Switch workspaces with mainMod + [1-4]
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4

# Move active window to a workspace with mainMod + SHIFT + [1-3]
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4


# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindel = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Resize windows
binde = $mainMod CTRL, left, resizeactive,-50 0
binde = $mainMod CTRL, right, resizeactive,50 0
binde = $mainMod CTRL, up, resizeactive,0 -50
binde = $mainMod CTRL, down, resizeactive,0 50

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Swap windows
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
