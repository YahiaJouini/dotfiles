##############################
# ENVIRONMENT VARIABLES
##############################

# --- NVIDIA Core ---
# Tell everything to use the NVIDIA Wayland/GBM backend
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GL_GSYNC_ALLOWED,1           # Allow G-Sync/VRR on supported monitors
env = __GL_VRR_ALLOWED,1

# --- Wayland Toolkit Backends ---
# Force all GTK apps to use Wayland natively (fallback x11, then anything)
env = GDK_BACKEND,wayland,x11,*
# Force Qt apps to use Wayland, fall back to XCB (X11) if needed
env = QT_QPA_PLATFORM,wayland;xcb
# SDL2 games/apps: use Wayland. Comment this out if an SDL game won't launch.
env = SDL_VIDEODRIVER,wayland
# Clutter-based apps (rare, but good to have)
env = CLUTTER_BACKEND,wayland

# --- XDG / Session Identity ---
# These tell D-Bus and portals what session we are
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# --- Qt Specifics ---
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# --- Electron/Chrome Apps (Discord, VSCode, Obsidian, etc.) ---
# Forces Electron >= 28 to use native Wayland — eliminates XWayland flicker
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# --- Firefox ---
env = MOZ_ENABLE_WAYLAND,1

# --- Cursor ---
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,22

env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,22

env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/keyring/ssh

env = XDG_MENU_PREFIX,arch-
