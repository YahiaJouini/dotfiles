# --- FONT & RENDERING ---
font_family      Hack Nerd Font
bold_font        Hack Nerd Font Bold
italic_font      Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size        12.0

# 'platform' is faster than 'legacy' on modern Wayland/Linux systems.
text_composition_strategy platform

# --- 144HZ PERFORMANCE TUNING ---
# 1000ms / 144Hz = 6.94ms per frame. 
# Setting delay to 5ms ensures Kitty is always ahead of the monitor's refresh cycle.
repaint_delay    5
input_delay      0
sync_to_monitor  yes

# Native Wayland support for Fedora 43
linux_display_server wayland

# --- VISUALS & TRANSPARENCY ---
background_opacity 0.8

# --- CURSOR ---
cursor_trail       3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# --- WINDOW & LAYOUT ---
window_padding_width     8
# Prevent 'stutter' when resizing splits in Neovim/Tmux
resize_debounce_time 0.05
confirm_os_window_close 0

# --- TAB LOOK (POWERLINE) ---
tab_bar_style           powerline
tab_powerline_style     slanted
tab_activity_symbol     "󱐋 "
tab_bar_margin_width    0.0
tab_bar_margin_height   0.0 0.0

# Enable the new pixel-level momentum scrolling
wheel_scroll_min_lines 1
wheel_scroll_multiplier 1.0
touch_scroll_multiplier 1.0

# --- MISC & OPTIMIZATION ---
enable_audio_bell no

confirm_os_window_close 0

# Faster throughput by reducing scrollback memory churn
scrollback_lines 2000
